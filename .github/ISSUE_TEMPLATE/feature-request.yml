name: Feature request
description: Suggest a focused improvement to MacBook Duo.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and privacy considerations
      description: Mention macOS versions, Mac models, permissions, screen capture, or network implications.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I understand this is an experimental macOS 15+ Apple Silicon project.
          required: true
